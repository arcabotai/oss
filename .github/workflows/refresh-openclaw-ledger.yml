name: Refresh OpenClaw ledger

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-openclaw-ledger
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run refresh:ledger
      - run: npm run check:claims
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit changed ledger snapshot
        run: |
          if git diff --quiet -- public/openclaw-prs.json; then
            echo "No OpenClaw ledger changes."
            exit 0
          fi
          git config user.name "Cad from Arca"
          git config user.email "cad@arcabot.ai"
          git add public/openclaw-prs.json
          git commit -m "chore: refresh OpenClaw ledger"
          git push
